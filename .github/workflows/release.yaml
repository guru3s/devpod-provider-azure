name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-provider:
    if: github.repository == 'guru3s/devpod-provider-azure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROVIDER_REPO: guru3s/devpod-provider-azure
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -mod=vendor ./...

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Build release assets
        run: ./hack/build.sh

      - name: Verify fork manifest
        run: |
          test "$(grep -c 'github.com/guru3s/devpod-provider-azure/releases/download/' release/provider.yaml)" -eq 7
          ! grep -q 'github.com/loft-sh/devpod-provider-azure/releases/download/' release/provider.yaml
          ! grep -q '##[A-Z_]*##' release/provider.yaml

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
